<script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwZkOGzMvWRBcR4kLawEI2RpIFlLBScCDfi5VDfCI5HuBZnuw2gtvPe-4_XgVh_QoQP/exec";

    let sessao = {
        usuario: "",
        perfil: "",
        filial: "",
        filiaisAutorizadas: [],
        tecnicos: [],
        mapaUrl: ""
    };

    let dadosIniciaisFilial = {
        controladoras: [],
        codigos: [],
        modelos: [],
        materiais: []
    };

    let osEmRevisao = null;
    let osNumeroSalvo = null;
    let cacheConsultaOS = [];
    let cacheEstoqueAtual = [];

    function abrirTela(id) {
        ["telaLogin", "telaMenu", "telaNovaOS", "telaRevisaoOS", "telaConsultaOS", "telaEstoque"].forEach(t => {
            document.getElementById(t).classList.add("hidden");
        });
        document.getElementById(id).classList.remove("hidden");
        window.scrollTo(0, 0);
    }

    document.querySelectorAll(".btnVoltarMenu").forEach(btn => {
        btn.addEventListener("click", () => abrirTela("telaMenu"));
    });

    document.getElementById("btnSair").addEventListener("click", () => {
        document.getElementById("formLogin").reset();
        document.getElementById("msgLogin").innerText = "";
        abrirTela("telaLogin");
    });

    document.getElementById("formLogin").addEventListener("submit", function(e) {
        e.preventDefault();
        const filial = document.getElementById("loginFilial").value;
        const usuario = document.getElementById("loginUsuario").value.trim();
        const senha = document.getElementById("loginSenha").value.trim();
        const btn = document.getElementById("btnEntrar");
        const msg = document.getElementById("msgLogin");

        btn.disabled = true;
        btn.innerText = "Autenticando...";
        msg.innerText = "";

        // Adicionando timestamp para evitar cache 304 do navegador
        const url = `${URL_APPS_SCRIPT}?action=login&filial=${encodeURIComponent(filial)}&usuario=${encodeURIComponent(usuario)}&senha=${encodeURIComponent(senha)}&_t=${new Date().getTime()}`;

        fetch(url)
        .then(r => r.text())
        .then(textoBruto => {
            btn.disabled = false;
            btn.innerText = "Entrar";

            try {
                const res = JSON.parse(textoBruto.trim());
                if (res.result === "success") {
                    sessao = {
                        usuario: res.user,
                        perfil: res.perfil,
                        filial: res.filial,
                        filiaisAutorizadas: res.filiaisAutorizadas || [res.filial],
                        tecnicos: res.tecnicos || [],
                        mapaUrl: res.mapaUrl || "https://www.google.com/maps"
                    };

                    document.getElementById("tituloFilialMenu").innerText = "Filial: " + sessao.filial;
                    document.getElementById("infoUsuarioMenu").innerText = `${sessao.perfil.toUpperCase()}: ${sessao.usuario}`;
                    document.getElementById("btnIrMapa").href = sessao.mapaUrl;

                    abrirTela("telaMenu");
                    carregarDadosIniciaisDaFilial(sessao.filial);
                } else {
                    msg.innerText = res.error || "Usuário ou senha incorretos.";
                }
            } catch (errParse) {
                console.error("Erro ao converter JSON:", textoBruto);
                msg.innerText = "Erro no servidor. Verifique se o Web App está público ('Qualquer pessoa').";
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerText = "Entrar";
            msg.innerText = "Erro de conexão com o Apps Script.";
            console.error(err);
        });
    });

    function carregarDadosIniciaisDaFilial(filial) {
        fetch(`${URL_APPS_SCRIPT}?action=getDadosIniciais&filial=${encodeURIComponent(filial)}&_t=${new Date().getTime()}`)
            .then(r => r.json())
            .then(data => {
                if (data.result === "success") {
                    dadosIniciaisFilial = data;
                    preencherCombosNovaOS();
                }
            })
            .catch(err => console.error("Erro ao carregar dados iniciais:", err));
    }

    document.getElementById("btnIrNovaOS").addEventListener("click", () => {
        document.getElementById("formOS").reset();
        document.getElementById("spanFilialOS").innerText = sessao.filial;
        document.getElementById("osTecnico").value = sessao.usuario;
        document.getElementById("camposDinamicosModelo").innerHTML = "";
        document.getElementById("blocoPendencia").classList.add("hidden");
        document.getElementById("blocoListaMateriais").classList.add("hidden");
        document.getElementById("blocoTrabalhadores").classList.add("hidden");

        const blocoCod = document.getElementById("blocoCodigosNiteroi");
        if (sessao.filial === "Niterói") {
            blocoCod.classList.remove("hidden");
        } else {
            blocoCod.classList.add("hidden");
        }

        preencherCombosNovaOS();
        abrirTela("telaNovaOS");
    });

    function preencherCombosNovaOS() {
        const dl = document.getElementById("datalistControladoras");
        dl.innerHTML = "";
        dadosIniciaisFilial.controladoras.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            dl.appendChild(opt);
        });

        const boxCod = document.getElementById("listaCodigosContainer");
        boxCod.innerHTML = "";
        dadosIniciaisFilial.codigos.forEach(c => {
            const div = document.createElement("div");
            div.style.marginBottom = "6px";
            div.innerHTML = `<label style="font-weight:normal; display:flex; align-items:center; gap:8px; cursor:pointer;">
                <input type="checkbox" class="chk-codigo-os" value="${c.numero}" style="width:auto; margin:0;">
                <span><b>${c.numero}</b> - ${c.descricao}</span>
            </label>`;
            boxCod.appendChild(div);
        });

        const selMod = document.getElementById("osModeloControlador");
        selMod.innerHTML = '<option value="">Selecione o modelo...</option>';
        dadosIniciaisFilial.modelos.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m;
            opt.innerText = m;
            selMod.appendChild(opt);
        });

        const gridMat = document.getElementById("gridMateriaisOS");
        gridMat.innerHTML = "";
        const listaCompletaMat = [...dadosIniciaisFilial.materiais];
        if (!listaCompletaMat.some(m => m.toLowerCase().includes("fita isolante"))) listaCompletaMat.push("Fita Isolante");
        if (!listaCompletaMat.some(m => m.toLowerCase().includes("auto fus"))) listaCompletaMat.push("Fita de Auto Fusão");

        listaCompletaMat.forEach((mat, idx) => {
            const isFita = mat.toLowerCase().includes("fita isolante") || mat.toLowerCase().includes("auto fus");
            const isCabo = mat.toLowerCase().includes("cabo");
            const div = document.createElement("div");
            div.className = "checkbox-item";
            div.innerHTML = `
                <input type="checkbox" class="chk-mat-os" data-nome="${mat}" data-fita="${isFita}" data-cabo="${isCabo}" id="mat_os_${idx}">
                <label for="mat_os_${idx}" style="margin:0; font-size:12px; flex:1; cursor:pointer;">${mat}</label>
                ${isFita ? '<span style="font-size:11px; color:#666;">(Uso geral)</span>' : `<input type="number" class="qtd-mat-os" min="1" placeholder="${isCabo ? 'Metros' : 'Qtd'}" style="width:72px; padding:4px; margin:0;">`}
            `;
            gridMat.appendChild(div);
        });
    }

    document.getElementById("osModeloControlador").addEventListener("change", function() {
        const mod = this.value;
        const container = document.getElementById("camposDinamicosModelo");
        container.innerHTML = "";

        if (!mod) return;

        let campos = [
            { id: "osTensaoCA", label: "Tensão Alternada (CA):" },
            { id: "osAterramento", label: "Aterramento:" }
        ];

        if (mod.toLowerCase() === "cross") {
            campos.push(
                { id: "osTensao75", label: "Tensão 7,5VCC:" },
                { id: "osTensao12", label: "Tensão 12VCC:" },
                { id: "osTensao24", label: "Tensão 24VCC:" },
                { id: "osFusiveis", label: "Fusíveis:" },
                { id: "osPadronizada", label: "Padronizada:" },
                { id: "osNobreak", label: "Nobreak:" }
            );
        } else if (mod.toLowerCase() === "dataprom") {
            campos.push(
                { id: "osTensaoMais5", label: "Tensão +5V:" },
                { id: "osTensaoMenos5", label: "Tensão -5V:" },
                { id: "osTensaoMais12", label: "Tensão +12V:" },
                { id: "osFusiveis", label: "Fusíveis:" },
                { id: "osPadronizada", label: "Padronizada:" },
                { id: "osNobreak", label: "Nobreak:" }
            );
        } else if (mod.toLowerCase() === "tesc") {
            campos.push(
                { id: "osCaboFlex", label: "Cabo Flex:" },
                { id: "osFusiveis", label: "Fusíveis:" },
                { id: "osNobreak", label: "Nobreak:" }
            );
        }

        campos.forEach(c => {
            const div = document.createElement("div");
            div.innerHTML = `<label for="${c.id}">${c.label}</label><input type="text" id="${c.id}" required>`;
            container.appendChild(div);
        });
    });

    document.querySelectorAll('input[name="status_servico"]').forEach(r => {
        r.addEventListener("change", function() {
            const bloco = document.getElementById("blocoPendencia");
            const txt = document.getElementById("osPendencia");
            if (this.value === "Pendente") {
                bloco.classList.remove("hidden");
                txt.required = true;
            } else {
                bloco.classList.add("hidden");
                txt.required = false;
                txt.value = "";
            }
        });
    });

    document.querySelectorAll('input[name="utilizou_material"]').forEach(r => {
        r.addEventListener("change", function() {
            const bloco = document.getElementById("blocoListaMateriais");
            if (this.value === "Sim") {
                bloco.classList.remove("hidden");
            } else {
                bloco.classList.add("hidden");
            }
        });
    });

    document.querySelectorAll('input[name="trabalho_altura"]').forEach(r => {
        r.addEventListener("change", function() {
            const bloco = document.getElementById("blocoTrabalhadores");
            const inp = document.getElementById("osTrabalhadores");
            if (this.value === "Sim") {
                bloco.classList.remove("hidden");
                inp.required = true;
            } else {
                bloco.classList.add("hidden");
                inp.required = false;
                inp.value = "";
            }
        });
    });

    document.getElementById("formOS").addEventListener("submit", function(e) {
        e.preventDefault();

        let codigosSelecionados = [];
        if (sessao.filial === "Niterói") {
            codigosSelecionados = Array.from(document.querySelectorAll(".chk-codigo-os:checked")).map(c => c.value);
            if (codigosSelecionados.length === 0) {
                alert("Selecione ao menos um Código do Serviço.");
                return;
            }
        }

        const usouMat = document.querySelector('input[name="utilizou_material"]:checked').value;
        const materiaisLista = [];
        const materiaisFormatados = [];

        if (usouMat === "Sim") {
            const itensMarcados = document.querySelectorAll("#gridMateriaisOS .checkbox-item");
            let erroQtd = false;
            itensMarcados.forEach(item => {
                const chk = item.querySelector(".chk-mat-os");
                if (chk && chk.checked) {
                    const nome = chk.getAttribute("data-nome");
                    const isFita = chk.getAttribute("data-fita") === "true";
                    const isCabo = chk.getAttribute("data-cabo") === "true";

                    if (isFita) {
                        materiaisLista.push({ material: nome, quantidade: "Utilizado" });
                        materiaisFormatados.push(nome);
                    } else {
                        const qtd = item.querySelector(".qtd-mat-os").value;
                        if (!qtd || Number(qtd) <= 0) {
                            erroQtd = true;
                        }
                        const unid = isCabo ? `${qtd} metros de ${nome}` : `${qtd}x ${nome}`;
                        materiaisLista.push({ material: nome, quantidade: qtd });
                        materiaisFormatados.push(unid);
                    }
                }
            });

            if (materiaisLista.length === 0) {
                alert("Você marcou que utilizou materiais. Selecione pelo menos um item.");
                return;
            }
            if (erroQtd) {
                alert("Informe a quantidade utilizada para todos os materiais selecionados.");
                return;
            }
        }

        const getVal = id => document.getElementById(id) ? document.getElementById(id).value.trim() : "";

        osEmRevisao = {
            action: "salvarOS",
            filial: sessao.filial,
            controladora: getVal("osControladora"),
            tipo_servico: document.querySelector('input[name="tipo_servico"]:checked').value,
            data_inicial: getVal("osDataInicial"),
            hora_inicial: getVal("osHoraInicial"),
            data_final: getVal("osDataFinal"),
            hora_final: getVal("osHoraFinal"),
            codigos_servico: codigosSelecionados.join(", "),
            descricao_servico: getVal("osDescricaoBreve"),
            modelo_controlador: getVal("osModeloControlador"),
            tensao_ca: getVal("osTensaoCA"),
            aterramento: getVal("osAterramento"),
            tensao_75vcc: getVal("osTensao75"),
            tensao_12vcc: getVal("osTensao12"),
            tensao_24vcc: getVal("osTensao24"),
            tensao_mais5v: getVal("osTensaoMais5"),
            tensao_menos5v: getVal("osTensaoMenos5"),
            tensao_mais12v: getVal("osTensaoMais12"),
            cabo_flex: getVal("osCaboFlex"),
            fusiveis: getVal("osFusiveis"),
            nobreak: getVal("osNobreak"),
            padronizada: getVal("osPadronizada"),
            cabeamento: getVal("osCabeamento"),
            involucro: getVal("osInvolucro"),
            gabinetes: getVal("osGabinetes"),
            placas_cpu_potencia: getVal("osPlacas"),
            grupos_focais: getVal("osGruposFocais"),
            colunas: getVal("osColunas"),
            bracos: getVal("osBracos"),
            status_controladora: document.querySelector('input[name="status_controladora"]:checked').value,
            status_servico: document.querySelector('input[name="status_servico"]:checked').value,
            pendencia: getVal("osPendencia"),
            material_texto: materiaisFormatados.length > 0 ? materiaisFormatados.join(", ") : "Nenhum material utilizado",
            materiais_lista: materiaisLista,
            observacao: getVal("osObservacao"),
            trabalho_altura: document.querySelector('input[name="trabalho_altura"]:checked').value,
            trabalhadores_altura: getVal("osTrabalhadores"),
            equipe: getVal("osEquipe"),
            tecnico: getVal("osTecnico")
        };

        montarTelaRevisao(osEmRevisao);
        document.getElementById("botoesAntesEnvio").classList.remove("hidden");
        document.getElementById("boxPosEnvio").classList.add("hidden");
        abrirTela("telaRevisaoOS");
    });

    function formatarDataBR(iso) {
        if (!iso || !iso.includes("-")) return iso;
        const p = iso.split("-");
        return `${p[2]}/${p[1]}/${p[0]}`;
    }

    function montarTelaRevisao(d) {
        let html = `
            <div class="revisao-linha"><b>Filial:</b> ${d.filial}</div>
            <div class="revisao-linha"><b>Controladora:</b> ${d.controladora}</div>
            <div class="revisao-linha"><b>Tipo de Serviço:</b> ${d.tipo_servico}</div>
            <div class="revisao-linha"><b>Período:</b> ${formatarDataBR(d.data_inicial)} ${d.hora_inicial} até ${formatarDataBR(d.data_final)} ${d.hora_final}</div>
            ${d.codigos_servico ? `<div class="revisao-linha"><b>Código(s):</b> ${d.codigos_servico}</div>` : ""}
            <div class="revisao-linha"><b>Descrição Breve:</b> ${d.descricao_servico}</div>
            <div class="revisao-linha"><b>Modelo Controlador:</b> ${d.modelo_controlador}</div>
            <div class="revisao-linha"><b>Tensão CA:</b> ${d.tensao_ca} | <b>Aterramento:</b> ${d.aterramento}</div>
        `;
        if (d.modelo_controlador.toLowerCase() === "cross") {
            html += `<div class="revisao-linha"><b>Saída CC:</b> 7,5V: ${d.tensao_75vcc} | 12V: ${d.tensao_12vcc} | 24V: ${d.tensao_24vcc} | <b>Fusíveis:</b> ${d.fusiveis} | <b>Nobreak:</b> ${d.nobreak} | <b>Padronizada:</b> ${d.padronizada}</div>`;
        } else if (d.modelo_controlador.toLowerCase() === "dataprom") {
            html += `<div class="revisao-linha"><b>Saída CC:</b> +5V: ${d.tensao_mais5v} | -5V: ${d.tensao_menos5v} | +12V: ${d.tensao_mais12v} | <b>Fusíveis:</b> ${d.fusiveis} | <b>Nobreak:</b> ${d.nobreak} | <b>Padronizada:</b> ${d.padronizada}</div>`;
        } else if (d.modelo_controlador.toLowerCase() === "tesc") {
            html += `<div class="revisao-linha"><b>Cabo Flex:</b> ${d.cabo_flex} | <b>Fusíveis:</b> ${d.fusiveis} | <b>Nobreak:</b> ${d.nobreak}</div>`;
        }
        html += `
            <div class="revisao-linha"><b>Componentes:</b> Cabeamento: ${d.cabeamento} | Invólucro: ${d.involucro} | Gabinetes: ${d.gabinetes} | Placas: ${d.placas_cpu_potencia} | Grupos Focais: ${d.grupos_focais} | Colunas: ${d.colunas} | Braços: ${d.bracos}</div>
            <div class="revisao-linha"><b>Status Controladora:</b> ${d.status_controladora} | <b>Status Serviço:</b> ${d.status_servico}</div>
            ${d.pendencia ? `<div class="revisao-linha"><b>Pendência:</b> ${d.pendencia}</div>` : ""}
            <div class="revisao-linha"><b>Material Utilizado:</b> ${d.material_texto}</div>
            <div class="revisao-linha"><b>Observação:</b> ${d.observacao}</div>
            <div class="revisao-linha"><b>Trabalho em Altura:</b> ${d.trabalho_altura} ${d.trabalhadores_altura ? `(${d.trabalhadores_altura})` : ""}</div>
            <div class="revisao-linha"><b>Equipe:</b> ${d.equipe} | <b>Técnico:</b> ${d.tecnico}</div>
        `;
        document.getElementById("conteudoRevisao").innerHTML = html;
    }

    document.getElementById("btnCorrigirOS").addEventListener("click", () => {
        abrirTela("telaNovaOS");
    });

    document.getElementById("btnConfirmarEnvioOS").addEventListener("click", function() {
        const btn = this;
        btn.disabled = true;
        btn.innerText = "Gravando na planilha...";

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(osEmRevisao)
        })
        .then(r => r.json())
        .then(res => {
            btn.disabled = false;
            btn.innerText = "✅ Confirmar e Enviar para Planilha";

            if (res.result === "success") {
                osNumeroSalvo = res.numero_os;
                document.getElementById("botoesAntesEnvio").classList.add("hidden");
                document.getElementById("boxPosEnvio").classList.remove("hidden");
                document.getElementById("msgSucessoOS").innerText = `✅ Ordem de Serviço Nº ${osNumeroSalvo} registrada com sucesso na planilha!`;
            } else {
                alert("Erro ao salvar: " + (res.error || "Tente novamente."));
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.innerText = "✅ Confirmar e Enviar para Planilha";
            alert("Erro de comunicação ao salvar a O.S.");
        });
    });

    function gerarMensagemWhatsApp(d, numOS) {
        let msg = `*Manutenção semafórica*\n\n` +
                  `*Data Inicial:* ${formatarDataBR(d.data_inicial)}\n` +
                  ` *Horário inicial:* ${d.hora_inicial}\n` +
                  `*Data final:* ${formatarDataBR(d.data_final)}\n` +
                  ` *Horário final:* ${d.hora_final}\n\n` +
                  ` *Controladora:* ${d.controladora}\n\n`;

        if (d.codigos_servico) {
            msg += ` *Código:* ${d.codigos_servico}\n\n`;
        }

        msg += `*Preventiva:*\n` +
               ` *Entrada de Alimentação (CA):* ${d.tensao_ca}\n` +
               ` *Aterramento:* ${d.aterramento}\n`;

        const mod = (d.modelo_controlador || "").toLowerCase();
        if (mod === "cross") {
            msg += ` *Nobreak:* ${d.nobreak}\n\n` +
                   ` *Fusíveis:* ${d.fusiveis}\n\n` +
                   ` *Saída da fonte de Alimentação (CC):*\n` +
                   ` *7,5V:* ${d.tensao_75vcc}\n` +
                   ` *12V:* ${d.tensao_12vcc}\n` +
                   ` *24V:* ${d.tensao_24vcc}\n\n`;
        } else if (mod === "dataprom") {
            msg += ` *Nobreak:* ${d.nobreak}\n\n` +
                   ` *Fusíveis:* ${d.fusiveis}\n\n` +
                   ` *Saída da fonte de Alimentação (CC):*\n` +
                   ` *+5V:* ${d.tensao_mais5v}\n` +
                   ` *-5V:* ${d.tensao_menos5v}\n` +
                   ` *+12V:* ${d.tensao_mais12v}\n\n`;
        } else if (mod === "tesc") {
            msg += ` *Cabo Flex:* ${d.cabo_flex}\n` +
                   ` *Nobreak:* ${d.nobreak}\n` +
                   ` *Fusíveis:* ${d.fusiveis}\n\n`;
        } else {
            msg += `\n`;
        }

        msg += ` *Cabeamento:* ${d.cabeamento}\n\n` +
               ` *Invólucro:* ${d.involucro}\n\n` +
               ` *Gabinetes:* ${d.gabinetes}\n\n` +
               ` *Placas de CPU e Potência:* ${d.placas_cpu_potencia}\n\n` +
               ` *Grupos focais:* ${d.grupos_focais}\n\n` +
               ` *Colunas:* ${d.colunas}\n\n` +
               ` *Braços:* ${d.bracos}\n\n`;

        if (d.padronizada) {
            msg += ` *Padronizada:* ${d.padronizada}\n\n`;
        }

        msg += ` *Status da Controladora:* ${d.status_controladora}\n\n` +
               ` *Material Utilizado:* ${d.material_texto}\n\n` +
               ` *Obs.:*\n${d.observacao}\n\n` +
               ` *Equipe:* ${d.equipe}\n` +
               ` *Eletrotécnico Responsável:* ${d.tecnico}\n\n` +
               ` *O.S SM:* ${numOS}`;

        return msg;
    }

    document.getElementById("btnEnviarWhatsAppOS").addEventListener("click", () => {
        const texto = gerarMensagemWhatsApp(osEmRevisao, osNumeroSalvo);
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, "_blank");
    });

    document.getElementById("btnIrConsultaOS").addEventListener("click", () => {
        const boxFilial = document.getElementById("boxFiltroFilialConsulta");
        const boxTec = document.getElementById("boxFiltroTecnicoConsulta");
        const selFilial = document.getElementById("consFilial");

        if (sessao.perfil === "supervisor") {
            boxFilial.classList.remove("hidden");
            boxTec.classList.remove("hidden");
            selFilial.innerHTML = "";
            sessao.filiaisAutorizadas.forEach(f => {
                const opt = document.createElement("option");
                opt.value = f;
                opt.innerText = f;
                if (f === sessao.filial) opt.selected = true;
                selFilial.appendChild(opt);
            });

            const selTec = document.getElementById("consTecnico");
            selTec.innerHTML = '<option value="">Todos</option>';
            sessao.tecnicos.forEach(t => {
                const opt = document.createElement("option");
                opt.value = t;
                opt.innerText = t;
                selTec.appendChild(opt);
            });
        } else {
            boxFilial.classList.add("hidden");
            boxTec.classList.add("hidden");
        }

        abrirTela("telaConsultaOS");
        executarBuscaOS();
    });

    document.getElementById("btnPesquisarOS").addEventListener("click", executarBuscaOS);

    function executarBuscaOS() {
        const btn = document.getElementById("btnPesquisarOS");
        btn.disabled = true;
        btn.innerText = "Buscando...";

        const filialBusca = (sessao.perfil === "supervisor") ? document.getElementById("consFilial").value : sessao.filial;
        const numOS = document.getElementById("consNumeroOS").value.trim();
        const dataIni = document.getElementById("consData").value;
        const tecnico = (sessao.perfil === "supervisor") ? document.getElementById("consTecnico").value : sessao.usuario;
        const equipe = document.getElementById("consEquipe").value;

        const url = `${URL_APPS_SCRIPT}?action=buscarOS&filial=${encodeURIComponent(filialBusca)}&filtroOS=${encodeURIComponent(numOS)}&filtroData=${encodeURIComponent(dataIni)}&filtroTecnico=${encodeURIComponent(tecnico)}&filtroEquipe=${encodeURIComponent(equipe)}&_t=${new Date().getTime()}`;

        fetch(url)
            .then(r => r.json())
            .then(res => {
                btn.disabled = false;
                btn.innerText = "🔍 Buscar Ordens de Serviço";
                cacheConsultaOS = res.lista || [];
                renderTabelaConsultaOS(cacheConsultaOS);
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerText = "🔍 Buscar Ordens de Serviço";
            });
    }

    function renderTabelaConsultaOS(lista) {
        const tbody = document.querySelector("#tabelaConsultaOS tbody");
        tbody.innerHTML = "";

        if (lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Nenhuma Ordem de Serviço encontrada.</td></tr>';
            return;
        }

        lista.forEach((os, idx) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><b>${os.numero_os}</b></td>
                <td>${formatarDataBR(os.data_inicial)}</td>
                <td>${os.controladora}</td>
                <td>${os.tecnico}</td>
                <td>${os.equipe}</td>
                <td>${os.status_servico}</td>
                <td style="display:flex; gap:5px; flex-wrap:wrap;">
                    <button type="button" class="btn-primary" style="width:auto; padding:5px 9px; font-size:12px; margin:0;" onclick="abrirModalVisualizarOS(${idx})">Visualizar</button>
                    <button type="button" class="btn-whats" style="width:auto; padding:5px 9px; font-size:12px; margin:0;" onclick="exportarWhatsAppConsulta(${idx})">WhatsApp</button>
                    <button type="button" class="btn-pdf" style="width:auto; padding:5px 9px; font-size:12px; margin:0;" onclick="gerarPDFOrdemServico(${idx})">PDF</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function abrirModalVisualizarOS(idx) {
        const os = cacheConsultaOS[idx];
        document.getElementById("modalNumOS").innerText = os.numero_os;
        document.getElementById("corpoModalOS").innerText = gerarMensagemWhatsApp(os, os.numero_os);
        document.getElementById("btnModalWhatsApp").onclick = () => exportarWhatsAppConsulta(idx);
        document.getElementById("btnModalPDF").onclick = () => gerarPDFOrdemServico(idx);
        document.getElementById("modalVisualizarOS").classList.remove("hidden");
    }

    document.getElementById("btnFecharModalOS").addEventListener("click", () => {
        document.getElementById("modalVisualizarOS").classList.add("hidden");
    });

    function exportarWhatsAppConsulta(idx) {
        const os = cacheConsultaOS[idx];
        const texto = gerarMensagemWhatsApp(os, os.numero_os);
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, "_blank");
    }

    function gerarPDFOrdemServico(idx) {
        const os = cacheConsultaOS[idx];
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const imgLogo = document.getElementById("logoPrincipal");
        try {
            doc.addImage(imgLogo, "PNG", 14, 10, 38, 14);
        } catch (e) {
            doc.setFontSize(12);
            doc.setTextColor(0, 137, 123);
            doc.setFont("helvetica", "bold");
            doc.text("ECOMIX", 14, 18);
        }

        doc.setFontSize(11);
        doc.setTextColor(50, 50, 50);
        doc.setFont("helvetica", "bold");
        doc.text("Ecomix Gestão e Planejamento", 60, 14);

        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.setFont("helvetica", "normal");
        doc.text(`Filial: ${sessao.filial || "Niterói"}`, 60, 20);

        doc.setFontSize(14);
        doc.setTextColor(0, 137, 123);
        doc.setFont("helvetica", "bold");
        doc.text(`O.S Nº ${os.numero_os}`, 196, 16, { align: "right" });

        doc.setDrawColor(0, 137, 123);
        doc.setLineWidth(0.6);
        doc.line(14, 26, 196, 26);

        const linhas = [
            [{ content: "DADOS DO CLIENTE E IDENTIFICAÇÃO", colSpan: 2, styles: { fillColor: [224, 242, 241], textColor: [0, 105, 92], fontStyle: "bold" } }],
            ["Controladora / Local", os.controladora || "-"],
            ["Tipo de Serviço", os.tipo_servico || "-"],
            ["Data / Horário Inicial", `${formatarDataBR(os.data_inicial)} às ${os.hora_inicial}`],
            ["Data / Horário Final", `${formatarDataBR(os.data_final)} às ${os.hora_final}`]
        ];

        if (os.codigos_servico) {
            linhas.push(["Código(s) do Serviço", os.codigos_servico]);
        }

        linhas.push(
            ["Descrição Breve", os.descricao_servico || "-"],
            [{ content: "CARACTERÍSTICAS TÉCNICAS E MEDIÇÕES", colSpan: 2, styles: { fillColor: [224, 242, 241], textColor: [0, 105, 92], fontStyle: "bold" } }],
            ["Entrada de Alimentação (CA)", os.tensao_ca || "-"],
            ["Aterramento", os.aterramento || "-"]
        );

        if (os.tensao_75vcc || os.tensao_12vcc || os.tensao_24vcc) {
            linhas.push(["Saída Fonte CC (Cross)", `7,5V: ${os.tensao_75vcc || "-"} | 12V: ${os.tensao_12vcc || "-"} | 24V: ${os.tensao_24vcc || "-"}`]);
        }
        if (os.fusiveis) linhas.push(["Fusíveis", os.fusiveis]);
        if (os.nobreak) linhas.push(["Nobreak", os.nobreak]);
        if (os.padronizada) linhas.push(["Padronizada", os.padronizada]);

        linhas.push(
            [{ content: "INFRAESTRUTURA E CONDIÇÕES DOS COMPONENTES", colSpan: 2, styles: { fillColor: [224, 242, 241], textColor: [0, 105, 92], fontStyle: "bold" } }],
            ["Cabeamento", os.cabeamento || "-"],
            ["Invólucro", os.involucro || "-"],
            ["Gabinetes", os.gabinetes || "-"],
            ["Placas de CPU e Potência", os.placas_cpu_potencia || "-"],
            ["Grupos Focais", os.grupos_focais || "-"],
            ["Colunas", os.colunas || "-"],
            ["Braços", os.bracos || "-"]
        );

        linhas.push(
            [{ content: "STATUS, MATERIAIS E OBSERVAÇÕES", colSpan: 2, styles: { fillColor: [224, 242, 241], textColor: [0, 105, 92], fontStyle: "bold" } }],
            ["Status da Controladora", os.status_controladora || "-"],
            ["Status do Serviço", os.status_servico || "-"]
        );

        if (os.pendencia) {
            linhas.push(["Motivo da Pendência", os.pendencia]);
        }

        linhas.push(
            ["Materiais Utilizados", os.material_texto || "Nenhum material utilizado"],
            ["Observações Detalhadas", os.observacao || "-"],
            ["Trabalho em Altura", `${os.trabalho_altura || "Não"} ${os.trabalhadores_altura ? `(Equipe: ${os.trabalhadores_altura})` : ""}`],
            ["Equipe e Responsável", `Equipe: ${os.equipe || "-"} | Técnico: ${os.tecnico || "-"}`]
        );

        doc.autoTable({
            startY: 30,
            body: linhas,
            theme: "grid",
            styles: { fontSize: 8.5, cellPadding: 2.5 },
            columnStyles: { 0: { fontStyle: "bold", cellWidth: 65 } }
        });

        doc.save(`OS_${os.numero_os}.pdf`);
    }

    document.getElementById("btnIrEstoque").addEventListener("click", () => {
        const boxFilial = document.getElementById("boxSeletorFilialEstoque");
        const selFilial = document.getElementById("estFilialSelect");

        if (sessao.perfil === "supervisor") {
            boxFilial.classList.remove("hidden");
            document.getElementById("tabBtnEntradaNF").classList.remove("hidden");
            document.getElementById("tabBtnTransferencia").classList.remove("hidden");

            selFilial.innerHTML = "";
            sessao.filiaisAutorizadas.forEach(f => {
                const opt = document.createElement("option");
                opt.value = f;
                opt.innerText = f;
                if (f === sessao.filial) opt.selected = true;
                selFilial.appendChild(opt);
            });
        } else {
            boxFilial.classList.add("hidden");
            document.getElementById("tabBtnEntradaNF").classList.add("hidden");
            document.getElementById("tabBtnTransferencia").classList.add("hidden");
        }

        ativarAbaEstoque("atual");
        abrirTela("telaEstoque");
        carregarDadosEstoque();
    });

    document.getElementById("estFilialSelect").addEventListener("change", carregarDadosEstoque);

    function getFilialEstoqueAtiva() {
        return (sessao.perfil === "supervisor") ? document.getElementById("estFilialSelect").value : sessao.filial;
    }

    function ativarAbaEstoque(aba) {
        ["subTelaEstoqueAtual", "subTelaEntradaNF", "subTelaTransferencia"].forEach(s => document.getElementById(s).classList.add("hidden"));
        ["tabBtnEstoqueAtual", "tabBtnEntradaNF", "tabBtnTransferencia"].forEach(b => {
            document.getElementById(b).classList.remove("btn-primary");
            document.getElementById(b).classList.add("btn-secondary");
        });

        if (aba === "atual") {
            document.getElementById("subTelaEstoqueAtual").classList.remove("hidden");
            document.getElementById("tabBtnEstoqueAtual").classList.replace("btn-secondary", "btn-primary");
        } else if (aba === "nf") {
            document.getElementById("subTelaEntradaNF").classList.remove("hidden");
            document.getElementById("tabBtnEntradaNF").classList.replace("btn-secondary", "btn-primary");
        } else if (aba === "trans") {
            document.getElementById("subTelaTransferencia").classList.remove("hidden");
            document.getElementById("tabBtnTransferencia").classList.replace("btn-secondary", "btn-primary");
            carregarPedidosTransferencia();
        }
    }

    document.getElementById("tabBtnEstoqueAtual").addEventListener("click", () => ativarAbaEstoque("atual"));
    document.getElementById("tabBtnEntradaNF").addEventListener("click", () => ativarAbaEstoque("nf"));
    document.getElementById("tabBtnTransferencia").addEventListener("click", () => ativarAbaEstoque("trans"));

    function carregarDadosEstoque() {
        const filial = getFilialEstoqueAtiva();
        fetch(`${URL_APPS_SCRIPT}?action=getEstoque&filial=${encodeURIComponent(filial)}&_t=${new Date().getTime()}`)
            .then(r => r.json())
            .then(res => {
                cacheEstoqueAtual = res.estoque || [];
                const tbody = document.querySelector("#tabelaEstoque tbody");
                tbody.innerHTML = "";

                if (cacheEstoqueAtual.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum material cadastrado.</td></tr>';
                } else {
                    cacheEstoqueAtual.forEach(item => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td><b>${item.material}</b></td>
                            <td>${formatarDataBR(item.data_ultima_entrada)}</td>
                            <td>${item.qtd_ultima_entrada}</td>
                            <td>${item.qtd_anterior}</td>
                            <td>${formatarDataBR(item.data_ultima_os)}</td>
                            <td><b>${item.estoque}</b></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                montarListasMateriaisEstoque();
            });
    }

    function montarListasMateriaisEstoque() {
        const lista = cacheEstoqueAtual.map(i => i.material);
        if (!lista.some(m => m.toLowerCase().includes("fita isolante"))) lista.push("Fita Isolante");
        if (!lista.some(m => m.toLowerCase().includes("auto fus"))) lista.push("Fita de Auto Fusão");

        const gridNF = document.getElementById("gridMateriaisNF");
        const gridTrans = document.getElementById("gridMateriaisTrans");
        gridNF.innerHTML = "";
        gridTrans.innerHTML = "";

        lista.forEach((mat, i) => {
            gridNF.innerHTML += `
                <div class="checkbox-item">
                    <input type="checkbox" class="chk-nf" data-mat="${mat}" id="nf_${i}">
                    <label for="nf_${i}" style="margin:0; font-size:12px; flex:1;">${mat}</label>
                    <input type="number" class="qtd-nf" min="1" placeholder="Qtd" style="width:70px; padding:4px; margin:0;">
                </div>
            `;
            gridTrans.innerHTML += `
                <div class="checkbox-item">
                    <input type="checkbox" class="chk-tr" data-mat="${mat}" id="tr_${i}">
                    <label for="tr_${i}" style="margin:0; font-size:12px; flex:1;">${mat}</label>
                    <input type="number" class="qtd-tr" min="1" placeholder="Qtd" style="width:70px; padding:4px; margin:0;">
                </div>
            `;
        });
    }

    document.getElementById("btnRegistrarNF").addEventListener("click", function() {
        const nfNum = document.getElementById("nfNumero").value.trim();
        const nfData = document.getElementById("nfData").value;
        if (!nfNum || !nfData) return alert("Preencha o Número da NF e a Data de Entrada.");

        const itens = [];
        document.querySelectorAll("#gridMateriaisNF .checkbox-item").forEach(row => {
            const chk = row.querySelector(".chk-nf");
            const qtd = row.querySelector(".qtd-nf").value;
            if (chk.checked && qtd > 0) {
                itens.push({ material: chk.getAttribute("data-mat"), quantidade: qtd });
            }
        });

        if (itens.length === 0) return alert("Selecione ao menos um material e informe a quantidade.");

        this.disabled = true;
        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "salvarNF",
                filial: getFilialEstoqueAtiva(),
                numero_nf: nfNum,
                data_entrada: nfData,
                usuario: sessao.usuario,
                itens: itens
            })
        })
        .then(r => r.json())
        .then(() => {
            this.disabled = false;
            alert("Nota Fiscal registrada com sucesso!");
            document.getElementById("nfNumero").value = "";
            carregarDadosEstoque();
            ativarAbaEstoque("atual");
        });
    });

    document.getElementById("btnEnviarPedidoTrans").addEventListener("click", function() {
        const origem = getFilialEstoqueAtiva();
        const destino = document.getElementById("transDestino").value;
        const dataPed = document.getElementById("transData").value;

        if (origem === destino) return alert("A filial de destino deve ser diferente da filial atual.");
        if (!dataPed) return alert("Informe a data do pedido.");

        const itens = [];
        document.querySelectorAll("#gridMateriaisTrans .checkbox-item").forEach(row => {
            const chk = row.querySelector(".chk-tr");
            const qtd = row.querySelector(".qtd-tr").value;
            if (chk.checked && qtd > 0) {
                itens.push({ material: chk.getAttribute("data-mat"), quantidade: qtd });
            }
        });

        if (itens.length === 0) return alert("Selecione ao menos um material para transferir.");

        this.disabled = true;
        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "criarTransferencia",
                filial_origem: origem,
                filial_destino: destino,
                data_pedido: dataPed,
                usuario: sessao.usuario,
                itens: itens
            })
        })
        .then(r => r.json())
        .then(() => {
            this.disabled = false;
            alert("Pedido de transferência enviado!");
            carregarPedidosTransferencia();
        });
    });

    function carregarPedidosTransferencia() {
        const filial = getFilialEstoqueAtiva();
        const box = document.getElementById("listaPedidosTrans");
        box.innerHTML = "Carregando pedidos...";

        fetch(`${URL_APPS_SCRIPT}?action=getTransferencias&filial=${encodeURIComponent(filial)}&_t=${new Date().getTime()}`)
            .then(r => r.json())
            .then(res => {
                const pedidos = res.pedidos || [];
                if (pedidos.length === 0) {
                    box.innerHTML = "<p>Nenhum pedido de transferência registrado nesta filial.</p>";
                    return;
                }

                box.innerHTML = "";
                pedidos.forEach((p, idx) => {
                    const div = document.createElement("div");
                    div.style.cssText = "border:1px solid #ccc; padding:10px; border-radius:6px; margin-bottom:10px; background:#f9f9f9;";
                    let itensHtml = p.itens.map((it, iIdx) => `
                        <div style="display:flex; align-items:center; gap:8px; margin:4px 0;">
                            <span style="flex:1; font-size:13px;">${it.material}</span>
                            <input type="number" id="edit_tr_${idx}_${iIdx}" value="${it.quantidade}" ${p.status !== "Pendente" ? "disabled" : ""} style="width:75px; padding:4px; margin:0;">
                        </div>
                    `).join("");

                    div.innerHTML = `
                        <div><b>Pedido:</b> ${p.id_pedido} | <b>Data:</b> ${formatarDataBR(p.data_pedido)} | <b>Status:</b> <span style="color:${p.status === 'Confirmado' ? 'green' : (p.status === 'Cancelado' ? 'red' : 'orange')}">${p.status}</span></div>
                        <div style="font-size:13px; margin:4px 0;"><b>Origem:</b> ${p.origem} ➔ <b>Destino:</b> ${p.destino}</div>
                        <div style="margin-top:8px;">${itensHtml}</div>
                        ${p.status === "Pendente" ? `
                            <div class="grid-2" style="margin-top:8px;">
                                <button type="button" onclick='responderTransferencia(${JSON.stringify(p)}, ${idx}, "Confirmado")'>✅ Confirmar Pedido</button>
                                <button type="button" class="btn-pdf" onclick='responderTransferencia(${JSON.stringify(p)}, ${idx}, "Cancelado")'>❌ Cancelar Pedido</button>
                            </div>
                        ` : ""}
                    `;
                    box.appendChild(div);
                });
            });
    }

    function responderTransferencia(pedido, idx, novoStatus) {
        const itensAtualizados = pedido.itens.map((it, iIdx) => {
            const inp = document.getElementById(`edit_tr_${idx}_${iIdx}`);
            return { material: it.material, quantidade: inp ? inp.value : it.quantidade };
        });

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "atualizarTransferencia",
                id_pedido: pedido.id_pedido,
                origem: pedido.origem,
                destino: pedido.destino,
                status: novoStatus,
                itens: itensAtualizados
            })
        })
        .then(r => r.json())
        .then(() => {
            alert(`Pedido ${pedido.id_pedido} marcado como ${novoStatus}!`);
            carregarPedidosTransferencia();
        });
    }

    document.getElementById("btnExportarPDFEstoque").addEventListener("click", () => {
        if (cacheEstoqueAtual.length === 0) return alert("Sem dados de estoque.");
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const filial = getFilialEstoqueAtiva();

        const imgLogo = document.getElementById("logoPrincipal");
        try {
            doc.addImage(imgLogo, "PNG", 14, 10, 38, 14);
        } catch (e) {}

        doc.setFontSize(11);
        doc.setTextColor(50, 50, 50);
        doc.setFont("helvetica", "bold");
        doc.text("Ecomix Gestão e Planejamento", 60, 14);

        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.setFont("helvetica", "normal");
        doc.text(`Controle de Estoque — Filial: ${filial}`, 60, 20);

        doc.setDrawColor(0, 137, 123);
        doc.setLineWidth(0.6);
        doc.line(14, 26, 196, 26);

        doc.autoTable({
            startY: 32,
            head: [["Material", "Última Entrada", "Qtd Comprada", "Qtd Anterior", "Última OS", "Estoque Atual"]],
            body: cacheEstoqueAtual.map(i => [
                i.material,
                formatarDataBR(i.data_ultima_entrada),
                i.qtd_ultima_entrada,
                i.qtd_anterior,
                formatarDataBR(i.data_ultima_os),
                i.estoque
            ]),
            theme: "grid",
            headStyles: { fillColor: [0, 137, 123] },
            styles: { fontSize: 9 }
        });

        doc.save(`Estoque_${filial}.pdf`);
    });
</script>
