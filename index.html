<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordem de Serviço - Ecomix Filial Niterói</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --bg: #f0fdf4;
      --card-bg: #ffffff;
      --text: #1f2937;
      --error: #dc2626;
    }
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: var(--primary); margin-bottom: 25px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; background: #f8fafc; }
    input:focus { border-color: var(--primary); outline: none; background: #fff; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-dark); }
    .btn-secondary { background-color: #475569; color: white; }
    .btn-secondary:hover { background-color: #334155; }
    .error-msg { color: var(--error); text-align: center; font-size: 14px; margin-top: 12px; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- TELA 1: MENU PRINCIPAL COM OS 4 BOTÕES -->
    <div id="telaMenu">
      <h2>Ecomix - Niterói</h2>
      <p style="text-align: center; color: #64748b; margin-bottom: 20px;">Selecione a opção desejada</p>
      
      <button class="btn-primary" onclick="mostrarTela('telaLoginTecnico', 'OS')">Lançamento de O.S.</button>
      <button class="btn-primary" style="background-color: #0369a1;" onclick="mostrarTela('telaLoginSupervisor', 'Relatorio')">Relatório</button>
      <button class="btn-primary" style="background-color: #047857;" onclick="mostrarTela('telaLoginSupervisor', 'Mapa')">Mapa</button>
      <button class="btn-primary" style="background-color: #b45309;" onclick="mostrarTela('telaLoginSupervisor', 'Estoque')">Estoque</button>
    </div>

    <!-- TELA 2: LOGIN DE TÉCNICO -->
    <div id="telaLoginTecnico" class="hidden">
      <h2>Login de Técnico</h2>
      <div class="form-group">
        <label>Usuário / Nome:</label>
        <input type="text" id="userTecnico" placeholder="Digite seu nome (ex: Alberto)">
      </div>
      <div class="form-group">
        <label>Senha:</label>
        <input type="password" id="passTecnico" placeholder="Digite sua senha">
      </div>
      <button class="btn-primary" onclick="fazerLogin('Técnico')">Entrar</button>
      <button class="btn-secondary" onclick="mostrarTela('telaMenu')">Voltar ao Menu</button>
      <div id="erroTecnico" class="error-msg"></div>
    </div>

    <!-- TELA 3: LOGIN DE SUPERVISOR (USADO PARA RELATÓRIO, MAPA E ESTOQUE) -->
    <div id="telaLoginSupervisor" class="hidden">
      <h2 id="tituloLoginSup">Login de Supervisor</h2>
      <div class="form-group">
        <label>Usuário / Nome:</label>
        <input type="text" id="userSupervisor" placeholder="Digite seu nome (ex: Fabiano)">
      </div>
      <div class="form-group">
        <label>Senha:</label>
        <input type="password" id="passSupervisor" placeholder="Digite sua senha">
      </div>
      <button class="btn-primary" onclick="fazerLogin('Supervisor')">Entrar</button>
      <button class="btn-secondary" onclick="mostrarTela('telaMenu')">Voltar ao Menu</button>
      <div id="erroSupervisor" class="error-msg"></div>
    </div>

    <!-- TELA 4: PAINEL DE OPERAÇÕES -->
    <div id="telaPainel" class="hidden">
      <h2 id="tituloPainel">Painel de Operações</h2>
      <p style="text-align: center;" id="saudacaoUsuario"></p>
      <p style="text-align: center; color: #475569; font-weight: bold;" id="moduloAtual"></p>
      <button class="btn-secondary" onclick="mostrarTela('telaMenu')">Voltar ao Menu</button>
    </div>

  </div>

  <script>
    const URL_CSV_USUARIOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vShNmQk5PSg_VscyPKrkzGneUz7s_sFvfAZXRk_iIKc2dL4rjTvt3cQ-AIXresDBSQiKUSUV6QbvRb3/pub?output=csv";
    
    let moduloSelecionado = "";

    function mostrarTela(idTela, modulo = "") {
      moduloSelecionado = modulo;
      
      document.getElementById('telaMenu').classList.add('hidden');
      document.getElementById('telaLoginTecnico').classList.add('hidden');
      document.getElementById('telaLoginSupervisor').classList.add('hidden');
      document.getElementById('telaPainel').classList.add('hidden');

      document.getElementById(idTela).classList.remove('hidden');

      if (idTela === 'telaLoginSupervisor') {
        const nomesModulos = { 'Relatorio': 'Relatório', 'Mapa': 'Mapa', 'Estoque': 'Estoque' };
        document.getElementById('tituloLoginSup').innerText = `Acesso - ${nomesModulos[modulo] || 'Supervisor'}`;
      }

      document.getElementById('erroTecnico').innerText = '';
      document.getElementById('erroSupervisor').innerText = '';
    }

    function parseCSV(text) {
      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 2) return [];
      
      const data = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(",").map(c => c.trim().replace(/"/g, ''));
        if (cols.length >= 3) {
          data.push({
            usuario: cols[0],
            senha: cols[1],
            nivel: cols[2]
          });
        }
      }
      return data;
    }

    async function fazerLogin(nivelRequerido) {
      const isSup = nivelRequerido === 'Supervisor';
      const inputUser = document.getElementById(isSup ? 'userSupervisor' : 'userTecnico').value.trim();
      const inputPass = document.getElementById(isSup ? 'passSupervisor' : 'passTecnico').value.trim();
      const divErro = document.getElementById(isSup ? 'erroSupervisor' : 'erroTecnico');

      if (!inputUser || !inputPass) {
        divErro.innerText = "Preencha o usuário e a senha.";
        return;
      }

      divErro.innerText = "A validar acesso...";

      try {
        const response = await fetch(URL_CSV_USUARIOS + "&t=" + new Date().getTime());
        if (!response.ok) throw new Error("Falha ao contactar base de dados.");

        const csvText = await response.text();
        const usuarios = parseCSV(csvText);

        const userClean = inputUser.toLowerCase();
        const passClean = inputPass;
        const reqNorm = nivelRequerido.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        const encontrado = usuarios.find(u => {
          const uNome = u.usuario.toLowerCase();
          const uSenha = u.senha;
          const uNivelNorm = u.nivel.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

          const matchUser = uNome === userClean;
          const matchPass = uSenha === passClean;
          
          let matchNivel = false;
          if (reqNorm === "supervisor") {
            matchNivel = uNivelNorm.includes("superv") || uNivelNorm.includes("encarregado");
          } else if (reqNorm === "tecnico") {
            matchNivel = uNivelNorm.includes("tecnico");
          }

          return matchUser && matchPass && matchNivel;
        });

        if (encontrado) {
          divErro.innerText = "";
          document.getElementById('telaLoginTecnico').classList.add('hidden');
          document.getElementById('telaLoginSupervisor').classList.add('hidden');
          document.getElementById('telaPainel').classList.remove('hidden');
          
          document.getElementById('tituloPainel').innerText = `Painel - ${moduloSelecionado || 'Geral'}`;
          document.getElementById('saudacaoUsuario').innerText = `Bem-vindo, ${encontrado.usuario}!`;
          document.getElementById('moduloAtual').innerText = `Módulo: ${moduloSelecionado}`;
        } else {
          divErro.innerText = isSup ? "Supervisor não cadastrado ou senha incorreta." : "Usuário ou senha de técnico incorretos.";
        }

      } catch (err) {
        console.error(err);
        divErro.innerText = "Erro de conexão ao verificar credenciais.";
      }
    }
  </script>
</body>
</html>
